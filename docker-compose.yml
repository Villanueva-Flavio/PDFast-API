services:
  server:
    container_name: pdfast_api_server
    build: .
    env_file: .env
    environment:
      REDIS_URL: tcp://redis:6379
    volumes:
      - ./Media:/usr/src/app/Media
    ports:
      - "8003:8003"
    depends_on:
      - redis
    restart: always

  redis:
    container_name: pdfast_api_redis
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

volumes:
  redis_data:
